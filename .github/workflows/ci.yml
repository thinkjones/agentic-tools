# Publish gate for agentic-tools. Runs the unit tests, the build (TOML
# round-trip), the generated-file drift check and the visibility check on
# every non-draft pull request, and again on every push to main, so a
# private or otherwise non-public repository addition is caught before it
# reaches main and on main itself.
#
# The daily refresh-stats.yml schedule owns the data refresh; this workflow
# only checks. The job name is the status check context that branch
# protection requires, so it is stable: "Validate CSV + check public".
name: Publish gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # refresh-stats.yml opens its pull request with GITHUB_TOKEN. GitHub does
  # create the pull_request run for such a pull request, but it parks it as
  # action_required and never executes it, so the required check never reports
  # and the pull request is blocked forever. workflow_dispatch is the one
  # event GITHUB_TOKEN still starts, so refresh-stats.yml dispatches this gate
  # against the branch it pushed: the check run lands on the branch head,
  # which is the pull request's head commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CSV + check public
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate gh with GITHUB_TOKEN
        run: |
          # GITHUB_TOKEN is an installation token; gh auth's viewer lookup fails
          # for that. The credential is still active via the GH_TOKEN env var.
          echo "$GH_TOKEN" | gh auth login --with-token \
            || echo "::warning::gh auth login did not resolve the token owner; gh api will use the GH_TOKEN environment variable"

      - name: Unit tests
        run: python3 scripts/run_tests.py

      - name: Build (TOML round-trip)
        run: python3 scripts/build.py

      - name: Generated files are in sync with the CSV
        run: |
          # git status, not git diff: a generated file that this commit deletes
          # is recreated by the build as an untracked file, which git diff
          # ignores and git status reports.
          STATUS="$(git status --porcelain --untracked-files=all -- starred_repos.toml starred_repos.json assets/readme/hero.svg assets/readme/lists.svg README.md)"
          if [ -n "$STATUS" ]; then
            printf '%s\n' "$STATUS"
            git diff --stat -- starred_repos.toml starred_repos.json assets/readme/hero.svg assets/readme/lists.svg README.md || true
            echo "::error::The generated files disagree with starred_repos.csv. Run 'python3 scripts/build.py' and commit the result."
            exit 1
          fi

      - name: Check every repo is public
        run: python3 scripts/check_public.py
