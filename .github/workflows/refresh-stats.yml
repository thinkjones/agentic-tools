# Every day, refresh the stars, forks, activity and releases of the listed
# repos, rebuild the README, charts and site data, and open a pull request with
# the result (main is protected). Merging it publishes the site. Lists are left
# as they are; new stars are still filed with the github-star-organizer skill.
name: Refresh stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: refresh-stats

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: refresh-stats
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh stats
        run: python3 scripts/export_stars.py --refresh | tee "$RUNNER_TEMP/export.txt"

      - name: Build
        run: python3 scripts/build.py

      - name: Check every repo is public
        run: python3 scripts/check_public.py

      - name: Open or update the pull request
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          today=$(date -u +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "Refresh repo stats ($today)"
          git push -qf origin "$BRANCH"
          {
            echo "Daily refresh of stars, forks, activity and releases, as of $today. Lists are unchanged. Merging publishes the site."
            echo
            echo '```'
            cat "$RUNNER_TEMP/export.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = 0 ]; then
            gh pr create --head "$BRANCH" --title "Refresh repo stats" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          fi
